name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate environment variables
      run: |
        echo "🔍 Validating environment variables..."

        # Check if optional secrets are set and provide warnings
        if [ -z "${{ secrets.PORTFOLIO_GITHUB_USERNAME }}" ]; then
          echo "⚠️  PORTFOLIO_GITHUB_USERNAME is not set (optional for portfolio)"
        else
          echo "✅ PORTFOLIO_GITHUB_USERNAME is set"
        fi

        if [ -z "${{ secrets.PORTFOLIO_GITHUB_TOKEN }}" ]; then
          echo "⚠️  PORTFOLIO_GITHUB_TOKEN is not set (optional for portfolio)"
        else
          echo "✅ PORTFOLIO_GITHUB_TOKEN is set"
        fi

        if [ -z "${{ secrets.PORTFOLIO_EMAILJS_SERVICE_ID }}" ]; then
          echo "⚠️  PORTFOLIO_EMAILJS_SERVICE_ID is not set (optional for portfolio)"
        else
          echo "✅ PORTFOLIO_EMAILJS_SERVICE_ID is set"
        fi

        if [ -z "${{ secrets.PORTFOLIO_EMAILJS_TEMPLATE_ID }}" ]; then
          echo "⚠️  PORTFOLIO_EMAILJS_TEMPLATE_ID is not set (optional for portfolio)"
        else
          echo "✅ PORTFOLIO_EMAILJS_TEMPLATE_ID is set"
        fi

        if [ -z "${{ secrets.PORTFOLIO_EMAILJS_USER_ID }}" ]; then
          echo "⚠️  PORTFOLIO_EMAILJS_USER_ID is not set (optional for portfolio)"
        else
          echo "✅ PORTFOLIO_EMAILJS_USER_ID is set"
        fi

        if [ -z "${{ secrets.PORTFOLIO_FIREBASE_API_KEY }}" ]; then
          echo "⚠️  PORTFOLIO_FIREBASE_API_KEY is not set (optional for portfolio)"
        else
          echo "✅ PORTFOLIO_FIREBASE_API_KEY is set"
        fi

        if [ -z "${{ secrets.PORTFOLIO_FIREBASE_PROJECT_ID }}" ]; then
          echo "⚠️  PORTFOLIO_FIREBASE_PROJECT_ID is not set (optional for portfolio)"
        else
          echo "✅ PORTFOLIO_FIREBASE_PROJECT_ID is set"
        fi

        echo "✅ Environment validation completed - portfolio can deploy with optional features disabled"

    - name: Create environment file
      run: |
        echo "🔧 Creating environment file..."
        cat > .env << EOF
        # API Configuration
        PORTFOLIO_API_URL=${{ secrets.PORTFOLIO_API_URL || 'https://your-production-api.com/api' }}

        # GitHub Configuration (token não exposto no cliente)
        PORTFOLIO_GITHUB_USERNAME=${{ secrets.PORTFOLIO_GITHUB_USERNAME }}
        PORTFOLIO_GITHUB_TOKEN=

        # Email Configuration (EmailJS)
        PORTFOLIO_EMAILJS_SERVICE_ID=${{ secrets.PORTFOLIO_EMAILJS_SERVICE_ID }}
        PORTFOLIO_EMAILJS_TEMPLATE_ID=${{ secrets.PORTFOLIO_EMAILJS_TEMPLATE_ID }}
        PORTFOLIO_EMAILJS_USER_ID=${{ secrets.PORTFOLIO_EMAILJS_USER_ID }}

        # Admin Configuration
        PORTFOLIO_ADMIN_USERNAME=${{ secrets.PORTFOLIO_ADMIN_USERNAME || 'admin@example.com' }}
        PORTFOLIO_ADMIN_PASSWORD=${{ secrets.PORTFOLIO_ADMIN_PASSWORD || 'secure_password' }}

        # Firebase Configuration
        PORTFOLIO_FIREBASE_API_KEY=${{ secrets.PORTFOLIO_FIREBASE_API_KEY }}
        PORTFOLIO_FIREBASE_AUTH_DOMAIN=${{ secrets.PORTFOLIO_FIREBASE_AUTH_DOMAIN }}
        PORTFOLIO_FIREBASE_DATABASE_URL=${{ secrets.PORTFOLIO_FIREBASE_DATABASE_URL }}
        PORTFOLIO_FIREBASE_PROJECT_ID=${{ secrets.PORTFOLIO_FIREBASE_PROJECT_ID }}
        PORTFOLIO_FIREBASE_STORAGE_BUCKET=${{ secrets.PORTFOLIO_FIREBASE_STORAGE_BUCKET }}
        PORTFOLIO_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.PORTFOLIO_FIREBASE_MESSAGING_SENDER_ID }}
        PORTFOLIO_FIREBASE_APP_ID=${{ secrets.PORTFOLIO_FIREBASE_APP_ID }}
        PORTFOLIO_FIREBASE_MEASUREMENT_ID=${{ secrets.PORTFOLIO_FIREBASE_MEASUREMENT_ID }}
        EOF

        echo "✅ Environment file created successfully (GitHub token not exposed)"



    - name: Build for production
      run: |
        echo "🔨 Building application for production..."
        chmod +x build-prod.sh
        ./build-prod.sh

        # Verify build output
        if [ ! -d "dist/KarolineRocha_Portfolio" ]; then
          echo "❌ Build failed - dist directory not found"
          exit 1
        fi

        echo "✅ Build completed successfully"

    - name: Setup GitHub Pages SPA routing
      run: |
        echo "🔧 Setting up GitHub Pages SPA routing..."

        # Copy 404.html to the root of the build output
        if [ -f "src/assets/404.html" ]; then
          cp src/assets/404.html dist/KarolineRocha_Portfolio/404.html
          echo "✅ 404.html copied to build output"
        else
          echo "⚠️  404.html not found in src/assets/"
        fi

        # Verify 404.html is in the build output
        if [ -f "dist/KarolineRocha_Portfolio/404.html" ]; then
          echo "✅ 404.html verified in build output"
        else
          echo "❌ 404.html not found in build output"
          exit 1
        fi

    - name: Verify build artifacts
      run: |
        echo "🔍 Verifying build artifacts..."

        # Check if essential files exist
        if [ ! -f "dist/KarolineRocha_Portfolio/index.html" ]; then
          echo "❌ index.html not found in build output"
          exit 1
        fi

        if [ ! -f "dist/KarolineRocha_Portfolio/assets/env.js" ]; then
          echo "❌ env.js not found in build output"
          exit 1
        fi

        # Check if environment variables are properly injected
        if ! grep -q "window.__env__" "dist/KarolineRocha_Portfolio/assets/env.js"; then
          echo "❌ Environment variables not properly injected"
          exit 1
        fi

        echo "✅ Build artifacts verified successfully"

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist/KarolineRocha_Portfolio'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify deployment
      run: |
        echo "🔍 Verifying deployment..."
        echo "Deployment URL: https://karolinerrocha.github.io/KarolineRocha_Portfolio/"
        echo "✅ Deployment completed successfully"

    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🎉 Deployment successful!"
          echo "🌐 Site URL: https://karolinerrocha.github.io/KarolineRocha_Portfolio/"
        else
          echo "❌ Deployment failed!"
          echo "Check the logs above for more details"
        fi
