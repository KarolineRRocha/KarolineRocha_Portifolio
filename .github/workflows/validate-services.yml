name: Validate Services

on:
  workflow_dispatch: # Manual trigger
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight

jobs:
  validate-services:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Validate GitHub API
      run: |
        echo "🔍 Validating GitHub API access..."
        
        # Test GitHub API with token
        response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/user" || echo "FAILED")
        
        if [[ "$response" == *"login"* ]]; then
          echo "✅ GitHub API access validated"
        else
          echo "❌ GitHub API access failed"
          echo "Response: $response"
          exit 1
        fi
        
    - name: Validate EmailJS Configuration
      run: |
        echo "🔍 Validating EmailJS configuration..."
        
        # Check if EmailJS credentials are properly formatted
        if [[ "${{ secrets.EMAILJS_SERVICE_ID }}" =~ ^service_[a-zA-Z0-9]+$ ]]; then
          echo "✅ EmailJS Service ID format is valid"
        else
          echo "❌ EmailJS Service ID format is invalid"
          exit 1
        fi
        
        if [[ "${{ secrets.EMAILJS_TEMPLATE_ID }}" =~ ^template_[a-zA-Z0-9]+$ ]]; then
          echo "✅ EmailJS Template ID format is valid"
        else
          echo "❌ EmailJS Template ID format is invalid"
          exit 1
        fi
        
        if [[ "${{ secrets.EMAILJS_USER_ID }}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
          echo "✅ EmailJS User ID format is valid"
        else
          echo "❌ EmailJS User ID format is invalid"
          exit 1
        fi
        
    - name: Validate Firebase Configuration
      run: |
        echo "🔍 Validating Firebase configuration..."
        
        # Check Firebase API key format
        if [[ "${{ secrets.FIREBASE_API_KEY }}" =~ ^AIza[a-zA-Z0-9_-]{35}$ ]]; then
          echo "✅ Firebase API Key format is valid"
        else
          echo "❌ Firebase API Key format is invalid"
          exit 1
        fi
        
        # Check Firebase Project ID
        if [[ "${{ secrets.FIREBASE_PROJECT_ID }}" =~ ^[a-z0-9-]+$ ]]; then
          echo "✅ Firebase Project ID format is valid"
        else
          echo "❌ Firebase Project ID format is invalid"
          exit 1
        fi
        
        # Test Firebase project access
        response=$(curl -s "https://${{ secrets.FIREBASE_PROJECT_ID }}.firebaseio.com/.json" || echo "FAILED")
        
        if [[ "$response" != "FAILED" ]]; then
          echo "✅ Firebase project access validated"
        else
          echo "⚠️  Firebase project access test failed (this might be normal for private projects)"
        fi
        
    - name: Validate Environment Variables
      run: |
        echo "🔍 Validating all environment variables..."
        
        # Create a test environment file
        cat > test.env << EOF
        API_URL=${{ secrets.API_URL || 'https://your-production-api.com/api' }}
        GITHUB_USERNAME=${{ secrets.GITHUB_USERNAME }}
        GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
        EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}
        EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}
        EMAILJS_USER_ID=${{ secrets.EMAILJS_USER_ID }}
        ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME || 'admin@example.com' }}
        ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD || 'secure_password' }}
        FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
        FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
        EOF
        
        # Check if all required variables are set
        required_vars=(
          "GITHUB_USERNAME"
          "GITHUB_TOKEN"
          "EMAILJS_SERVICE_ID"
          "EMAILJS_TEMPLATE_ID"
          "EMAILJS_USER_ID"
          "FIREBASE_API_KEY"
          "FIREBASE_PROJECT_ID"
        )
        
        for var in "${required_vars[@]}"; do
          if grep -q "^${var}=" test.env; then
            value=$(grep "^${var}=" test.env | cut -d'=' -f2)
            if [ -n "$value" ] && [ "$value" != "" ]; then
              echo "✅ $var is set"
            else
              echo "❌ $var is empty"
              exit 1
            fi
          else
            echo "❌ $var is missing"
            exit 1
          fi
        done
        
        echo "✅ All required environment variables are properly configured"
        
    - name: Test Build Process
      run: |
        echo "🔍 Testing build process..."
        
        # Create environment file for build test
        cat > .env << EOF
        API_URL=${{ secrets.API_URL || 'https://your-production-api.com/api' }}
        GITHUB_USERNAME=${{ secrets.GITHUB_USERNAME }}
        GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
        EMAILJS_SERVICE_ID=${{ secrets.EMAILJS_SERVICE_ID }}
        EMAILJS_TEMPLATE_ID=${{ secrets.EMAILJS_TEMPLATE_ID }}
        EMAILJS_USER_ID=${{ secrets.EMAILJS_USER_ID }}
        ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME || 'admin@example.com' }}
        ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD || 'secure_password' }}
        FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
        FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
        FIREBASE_DATABASE_URL=${{ secrets.FIREBASE_DATABASE_URL }}
        FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
        FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
        EOF
        
        # Test build process
        chmod +x build-prod.sh
        ./build-prod.sh
        
        # Verify build output
        if [ -d "dist/KarolineRocha_Portfolio" ] && [ -f "dist/KarolineRocha_Portfolio/index.html" ]; then
          echo "✅ Build process completed successfully"
        else
          echo "❌ Build process failed"
          exit 1
        fi
        
    - name: Generate Validation Report
      run: |
        echo "📋 Generating validation report..."
        echo "## Service Validation Report" >> validation-report.md
        echo "Generated on: $(date)" >> validation-report.md
        echo "" >> validation-report.md
        echo "### ✅ Validated Services:" >> validation-report.md
        echo "- GitHub API: ✅ Access confirmed" >> validation-report.md
        echo "- EmailJS: ✅ Configuration valid" >> validation-report.md
        echo "- Firebase: ✅ Configuration valid" >> validation-report.md
        echo "- Environment Variables: ✅ All required variables set" >> validation-report.md
        echo "- Build Process: ✅ Successful" >> validation-report.md
        echo "" >> validation-report.md
        echo "### 🌐 Deployment URL:" >> validation-report.md
        echo "https://karolinerrocha.github.io/KarolineRocha_Portfolio/" >> validation-report.md
        
        echo "✅ Validation report generated"
        
    - name: Upload Validation Report
      uses: actions/upload-artifact@v3
      with:
        name: validation-report
        path: validation-report.md
