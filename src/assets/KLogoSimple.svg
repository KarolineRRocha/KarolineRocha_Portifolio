<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="simpleTechGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8a2be2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1493;stop-opacity:1" />
    </linearGradient>

    <filter id="simpleTechGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Clear K that actually looks like K -->
  <g filter="url(#simpleTechGlow)">
    <!-- K - Vertical line -->
    <rect x="18" y="12" width="3" height="36" rx="1.5" fill="url(#simpleTechGradient)"/>

    <!-- K - Top diagonal (proper K shape) -->
    <path d="M 21 12 L 32 22 L 21 28 Z" fill="url(#simpleTechGradient)"/>

    <!-- K - Bottom diagonal (proper K shape) -->
    <path d="M 21 32 L 32 38 L 21 48 Z" fill="url(#simpleTechGradient)"/>

    <!-- Circuit nodes -->
    <circle cx="19.5" cy="18" r="1.5" fill="#00d4ff"/>
    <circle cx="19.5" cy="30" r="1.5" fill="#8a2be2"/>
    <circle cx="19.5" cy="42" r="1.5" fill="#ff1493"/>
    <circle cx="26" cy="25" r="1" fill="#00d4ff"/>
    <circle cx="26" cy="35" r="1" fill="#ff1493"/>
  </g>

  <!-- Binary accent -->
  <g opacity="0.7">
    <text x="35" y="25" font-family="monospace" font-size="6" fill="#00d4ff">10</text>
    <text x="35" y="35" font-family="monospace" font-size="6" fill="#8a2be2">01</text>
    <text x="35" y="45" font-family="monospace" font-size="6" fill="#ff1493">11</text>
  </g>

  <!-- Animated elements -->
  <circle cx="12" cy="12" r="1" fill="#00d4ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="48" cy="48" r="1" fill="#ff1493" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- Scanning line -->
  <rect x="0" y="0" width="60" height="1" fill="url(#simpleTechGradient)" opacity="0.6">
    <animate attributeName="y" values="0;59;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
