  <script>
    // Detect environment and adjust base href
    (function () {
      var isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      var isGitHubPages = window.location.hostname === 'karolinerrocha.github.io';

      if (isGitHubPages) {
        // For GitHub Pages, change base href
        var baseElement = document.querySelector('base');
        baseElement.href = '/KarolineRocha_Portfolio/';

        // Update image paths for GitHub Pages
        var images = document.querySelectorAll('img[src^="/KarolineRocha_Portfolio/"]');
        images.forEach(function (img) {
          // Keep absolute paths for GitHub Pages
        });
      } else {
        // For localhost, use relative paths
        var images = document.querySelectorAll('img[src^="/KarolineRocha_Portfolio/"]');
        images.forEach(function (img) {
          img.src = img.src.replace('/KarolineRocha_Portfolio/', '');
        });

        // Update favicon paths for localhost
        var favicons = document.querySelectorAll('link[href^="/KarolineRocha_Portfolio/"]');
        favicons.forEach(function (link) {
          link.href = link.href.replace('/KarolineRocha_Portfolio/', '');
        });
      }
    })();
  </script>

<!-- GitHub Pages SPA routing script -->
<script type="text/javascript">
  // Single Page Apps for GitHub Pages
  // MIT License
  // https://github.com/rafgraph/spa-github-pages
  // This script checks to see if a redirect is present in the query string,
  // converts it back into the correct url and adds it to the
  // browser's history using window.history.replaceState(...),
  // which won't cause the browser to attempt to load the new url.
  // When the single page app is loaded further down in this file,
  // the correct url will be waiting in the browser's history for
  // the single page app to route accordingly.
  (function (l) {
    if (l.search[1] === '/') {
      var decoded = l.search.slice(1).split('&').map(function (s) {
        return s.replace(/~and~/g, '&')
      }).join('?');
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + decoded + l.hash
      );
    }
  }(window.location))
</script>
