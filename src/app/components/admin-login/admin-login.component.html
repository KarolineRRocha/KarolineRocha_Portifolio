<div class="admin-login-overlay">
  <div class="admin-login-modal">
    <div class="modal-header">
      <h2>Admin Login</h2>
      <button class="close-btn" (click)="onCancel()">×</button>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Email</label>
        <input type="email" id="username" name="username" [(ngModel)]="credentials.username" class="form-input" placeholder="Enter email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-group">
          <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="credentials.password" class="form-input" placeholder="Enter password" required autocomplete="current-password">
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()">
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="isLoading">
          Cancel
        </button>
        <button type="submit" class="btn-primary" [disabled]="isLoading || !credentials.username || !credentials.password">
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>
      </div>
    </form>
  </div>
</div>
