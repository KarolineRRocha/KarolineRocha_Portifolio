<div class="edit-modal-overlay">
  <div class="edit-modal">
    <div class="modal-header">
      <h2>Edit Project</h2>
      <button class="close-btn" (click)="onCancel()">&times;</button>
    </div>

    <div class="modal-content">
      <!-- Form Section -->
      <div class="form-section">
        <div class="form-group">
          <label for="projectName">Project Name *</label>
          <input type="text" id="projectName" class="form-input" [(ngModel)]="editedProject.name" placeholder="Enter project name">
        </div>

        <div class="form-group">
          <label for="projectDescription">Description</label>
          <textarea id="projectDescription" class="form-textarea" [(ngModel)]="editedProject.description" placeholder="Enter project description (optional)"></textarea>
        </div>

        <div class="form-group">
          <label>Languages</label>
          <div class="languages-container">
            <div class="language-tags">
              <span class="lang-tag" *ngFor="let lang of editedProject.languages; let i = index" [class.editing]="editingTechIndex === i">
                <div class="lang-controls">
                  <button class="move-lang-btn move-left" (click)="moveTechnology(i, 'left')" [disabled]="i === 0" title="Move left">
                    ←
                  </button>
                  <button class="move-lang-btn move-right" (click)="moveTechnology(i, 'right')" [disabled]="i === editedProject.languages!.length - 1" title="Move right">
                    →
                  </button>
                </div>
                <span *ngIf="editingTechIndex !== i" (click)="startEditingLang(i, lang)">{{ lang }}</span>
                <input *ngIf="editingTechIndex === i" type="text" class="edit-lang-input" [(ngModel)]="editingTechValue" (keyup.enter)="saveEditedLang()" (keyup.escape)="cancelEditingLang()" (blur)="saveEditedLang()">
                <button class="remove-lang" (click)="removeLanguage(i)">&times;</button>
              </span>
            </div>
            <div class="add-lang-section" *ngIf="!isAddingTech">
              <button class="btn-add-lang" (click)="startAddingTech()">+ Add Language</button>
            </div>
            <div class="add-lang-input" *ngIf="isAddingTech">
              <input type="text" class="form-input" [(ngModel)]="newTech" placeholder="Enter language name" (keyup.enter)="addLanguage()">
              <button class="btn-confirm-lang" (click)="addLanguage()">Add</button>
              <button class="btn-cancel-lang" (click)="cancelAddingLang()">Cancel</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="projectImage">Image URL (opcional)</label>
          <input type="url" id="projectImage" class="form-input" [(ngModel)]="editedProject.imageUrl" placeholder="Enter image URL" (input)="onImageUrlChange()">
          <small class="form-help">Ou faça upload de uma imagem abaixo</small>
        </div>

        <div class="form-group">
          <label for="demoUrl">Demo URL</label>
          <input type="url" id="demoUrl" class="form-input" [(ngModel)]="editedProject.demoUrl" placeholder="Enter demo URL">
        </div>

        <div class="form-group">
          <label for="projectUrl">Code URL</label>
          <input type="url" id="projectUrl" class="form-input" [(ngModel)]="editedProject.projectUrl" placeholder="Enter code URL">
        </div>
      </div>

      <!-- Project Preview -->
      <div class="preview-section">
        <h3>Preview</h3>

        <div class="preview-image">

        </div>

        <!-- File Upload Section -->
        <div class="file-upload-section">
          <p class="upload-info">📁 Upload de Imagem (recomendado)</p>
          <input type="file" id="editPreviewImageFileInput" (change)="onFileSelected($event)" accept="image/*" class="file-input">
          <label for="editPreviewImageFileInput" class="file-upload-label">
            <span *ngIf="!selectedFileName">📤 Escolher Imagem</span>
            <span *ngIf="selectedFileName">✅ {{ selectedFileName }}</span>
          </label>
          <button *ngIf="editedProject.uploadedImage" class="btn-remove-file" (click)="removeUploadedImage()">🗑️ Remover</button>
          <small class="upload-help">Formatos aceitos: JPG, PNG, GIF, WebP (máx. 5MB)</small>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" (click)="onCancel()">Cancel</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="!editedProject.name">Save Changes</button>
    </div>
  </div>
</div>
