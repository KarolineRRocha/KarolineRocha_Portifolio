<div class="edit-modal-overlay">
  <div class="edit-modal">
    <div class="modal-header">
      <h2>Edit Project</h2>
      <button class="close-btn" (click)="onCancel()">&times;</button>
    </div>

    <div class="modal-content">
      <!-- Form Section -->
      <div class="form-section">
        <div class="form-group">
          <label for="projectName">Project Name *</label>
          <input type="text" id="projectName" class="form-input" [(ngModel)]="editedProject.name" placeholder="Enter project name">
        </div>

        <div class="form-group">
          <label for="projectDescription">Description *</label>
          <textarea id="projectDescription" class="form-textarea" [(ngModel)]="editedProject.description" placeholder="Enter project description"></textarea>
        </div>

        <div class="form-group">
          <label>Technologies</label>
          <div class="technologies-container">
            <div class="technology-tags">
              <span class="tech-tag" *ngFor="let tech of editedProject.technologies; let i = index">
                {{ tech }}
                <button class="remove-tech" (click)="removeTechnology(i)">&times;</button>
              </span>
            </div>
            <div class="add-tech-section">
              <button class="btn-add-tech" (click)="addTechnology()">+ Add Technology</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="projectImage">Image URL</label>
          <input type="url" id="projectImage" class="form-input" [(ngModel)]="editedProject.imageUrl" placeholder="Enter image URL">
        </div>

        <div class="form-group">
          <label for="demoUrl">Demo URL</label>
          <input type="url" id="demoUrl" class="form-input" [(ngModel)]="editedProject.demoUrl" placeholder="Enter demo URL">
        </div>

        <div class="form-group">
          <label for="projectUrl">Code URL</label>
          <input type="url" id="projectUrl" class="form-input" [(ngModel)]="editedProject.projectUrl" placeholder="Enter code URL">
        </div>
      </div>

      <!-- Project Preview -->
      <div class="preview-section">
        <h3>Preview</h3>

        <div class="preview-image">

        </div>

        <!-- File Upload Link Below Image -->
        <div class="file-upload-section">
          <input type="file" id="editPreviewImageFileInput" (change)="onFileSelected($event)" accept="image/*" class="file-input">
          <label for="editPreviewImageFileInput" class="file-upload-label">
            Escolher Ficheiro
          </label>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" (click)="onCancel()">Cancel</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="!editedProject.name || !editedProject.description">Save Changes</button>
    </div>
  </div>
</div>
