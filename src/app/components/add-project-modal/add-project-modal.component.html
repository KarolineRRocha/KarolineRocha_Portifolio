<div class="add-modal-overlay">
  <div class="add-modal">
    <div class="modal-header">
      <h2>Add New Project</h2>
      <button class="close-btn" (click)="onCancel()">&times;</button>
    </div>

    <div class="modal-content">
      <!-- Form Section -->
      <div class="form-section">
        <div class="form-group">
          <label for="projectName">Project Name *</label>
          <input type="text" id="projectName" class="form-input" [(ngModel)]="newProject.name" placeholder="Enter project name">
        </div>

        <div class="form-group">
          <label for="projectDescription">Description</label>
          <textarea id="projectDescription" class="form-textarea" [(ngModel)]="newProject.description" placeholder="Enter project description (optional)"></textarea>
        </div>

        <div class="form-group">
          <label>Technologies</label>
          <div class="technologies-container">
            <div class="technology-tags">
              <span class="tech-tag" *ngFor="let tech of technologies; let i = index">
                {{ tech }}
                <button class="remove-tech" (click)="removeTechnology(i)">&times;</button>
              </span>
            </div>
            <div class="add-tech-section" *ngIf="!isAddingTech">
              <button class="btn-add-tech" (click)="startAddingTech()">+ Add Technology</button>
            </div>
            <div class="add-tech-input" *ngIf="isAddingTech">
              <input type="text" class="form-input" [(ngModel)]="newTech" placeholder="Enter technology name" (keyup.enter)="addTechnology()">
              <button class="btn-confirm-tech" (click)="addTechnology()">Add</button>
              <button class="btn-cancel-tech" (click)="cancelAddingTech()">Cancel</button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="imageUrl">Image URL (opcional)</label>
          <input type="url" id="imageUrl" class="form-input" [(ngModel)]="newProject.imageUrl" placeholder="Enter image URL" (input)="onImageUrlChange()">
          <small class="form-help">Ou faça upload de uma imagem abaixo</small>
        </div>

        <div class="form-group">
          <label for="demoUrl">Demo URL</label>
          <input type="url" id="demoUrl" class="form-input" [(ngModel)]="newProject.demoUrl" placeholder="Enter demo URL">
        </div>

        <div class="form-group">
          <label for="projectUrl">Code URL</label>
          <input type="url" id="projectUrl" class="form-input" [(ngModel)]="newProject.projectUrl" placeholder="Enter code URL">
        </div>
      </div>

      <!-- Project Preview -->
      <div class="preview-section">
        <h3>Preview</h3>

        </div>

        <!-- File Upload Section -->
        <div class="file-upload-section">
          <p class="upload-info">📁 Upload de Imagem (recomendado)</p>
          <input type="file" id="previewImageFileInput" (change)="onFileSelected($event)" accept="image/*" class="file-input">
          <label for="previewImageFileInput" class="file-upload-label">
            <span *ngIf="!selectedFileName">📤 Escolher Imagem</span>
            <span *ngIf="selectedFileName">✅ {{ selectedFileName }}</span>
          </label>
          <button *ngIf="selectedFileName" class="btn-remove-file" (click)="removeUploadedImage()">🗑️ Remover</button>
          <small class="upload-help">Formatos aceitos: JPG, PNG, GIF, WebP (máx. 5MB)</small>
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" (click)="onCancel()">Cancel</button>
      <button class="btn-primary" (click)="onSave()" [disabled]="!newProject.name">Save Project</button>
    </div>
  </div>
</div>
